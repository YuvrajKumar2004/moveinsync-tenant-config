# No-Docker profile: file-based H2 in PostgreSQL mode, readable logs, faults endpoint on.
spring:
  datasource:
    url: jdbc:h2:file:./data/config-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}

app:
  # The signing key has no default here either: JWT_SECRET comes from the environment / .env
  # (scripts/run-local.sh creates one with scripts/init-env.sh).
  faults:
    enabled: ${FAULTS_ENABLED:true}
